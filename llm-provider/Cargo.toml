[package]
name = "llm-provider"
version = "1.0.0"
edition = "2021"

[lib]
name = "llm_provider"
path = "src/lib.rs"

[[bin]]
name = "llm-provider"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
futures-util = "0.3"
hex = "0.4"
portable-pty = "0.8"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.8"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[profile.release]
lto = true
strip = true
