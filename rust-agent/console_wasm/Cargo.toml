[package]
name = "console_wasm"
version = "0.1.0"
edition = "2021"
description = "WASM chat island — product UI logic in Rust (wasm-bindgen glue only)"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_core = { path = "../console_core" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlTextAreaElement",
  "HtmlButtonElement",
  "HtmlInputElement",
  "Event",
  "EventTarget",
  "SubmitEvent",
  "MouseEvent",
  "DomTokenList",
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "TextDecoder",
] }
