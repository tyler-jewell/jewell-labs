[workspace]
members = [".", "console_core", "console_wasm"]
resolver = "2"

[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"
description = "Leptos agent console: list, certify, and chat with agents/*.md"
default-run = "rust-agent"

[dependencies]
console_core = { path = "console_core" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
leptos = { version = "0.7", features = ["ssr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[[bin]]
name = "eval_introspection"
path = "src/bin/eval_introspection.rs"

[[bin]]
name = "eval_compare"
path = "src/bin/eval_compare.rs"

[[bin]]
name = "eval_catalog"
path = "src/bin/eval_catalog.rs"

[lib]
name = "rust_agent"
path = "src/lib.rs"
